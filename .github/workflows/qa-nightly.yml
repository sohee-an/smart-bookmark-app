name: QA Nightly

# QATester 나이틀리. 재검증 필요한 시나리오만 다시 돌린다 (단위 + E2E + 실제 AI).
# 결정론 경계: 돌리는 건 자동, 결과를 보고 무엇을 고칠지는 사람이 정한다. CI를 막지 않는다.
#
# 실제 AI 점검(live)은 GEMINI_API_KEY 시크릿이 있을 때만 돈다. 없으면 단위 + E2E만 돌고 보고서에 그렇게 적힌다.
# CI는 보고만 한다: 결과는 이 실행의 요약(Job Summary)과 보고서 아티팩트로만 남는다.
#  - 이슈를 만들지 않는다. 공개와 이슈 등록은 사람이 정한다 (CLAUDE.md 사람 경계)
#  - CI에서 쌓인 근거(facts.jsonl)는 올리지 않는다. 장부는 로컬에서 돌리고 사람이 커밋한 것 하나다
#  - 공개 저장소라 private 시나리오와 실행 로그는 보고서에서 뺀다. 연속 실패 판정은 로컬 장부에서 한다
on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST
    # 첫 주 관찰용 추가 실행: 13:00, 20:00 KST. gate 잡이 2026-10-18(일) KST가 지나면 건너뛴다. 관찰이 끝나면 이 줄을 지운다
    - cron: "0 4,11 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "실제 AI 점검 포함"
        type: boolean
        default: true

concurrency:
  group: qa-nightly
  cancel-in-progress: false

jobs:
  # 첫 주 관찰용 추가 예약은 기한이 지나면 돌지 않는다 (cron에는 만료가 없어서 여기서 막는다)
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "0 4,11 * * *" ] && [ "$(TZ=Asia/Seoul date +%F)" \> "2026-10-18" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::첫 주 관찰용 추가 실행 기한(2026-10-18 KST)이 지나서 건너뛴다"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # E2E는 API를 mock하므로 자리표시 값으로 충분하다. live는 로컬 Supabase 값을 스크립트가 직접 넣는다
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      RESEND_API_KEY: re_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright 브라우저
        run: pnpm --filter @smart-bookmark/web exec playwright install --with-deps chromium
      - name: 실제 AI 점검 가능 여부
        id: live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ "${{ github.event_name != 'workflow_dispatch' || inputs.live }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY 시크릿이 없거나 live를 껐다. 실제 AI 점검은 건너뛴다"
          fi
      - name: 로컬 Supabase 시작
        if: steps.live.outputs.enabled == 'true'
        run: npx -y supabase@2.120.0 start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,postgres-meta
      - name: 나이틀리 재검증 (보고만)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 빈 문자열은 표현식에서 거짓이라 `조건 && '' || '--no-live'`는 항상 --no-live가 된다. 반대로 쓴다
          LIVE_FLAG: ${{ steps.live.outputs.enabled != 'true' && '--no-live' || '' }}
        run: node scripts/qa/nightly.mjs --ci $LIVE_FLAG | tail -1
      - name: 로컬 Supabase 종료
        if: always() && steps.live.outputs.enabled == 'true'
        run: npx -y supabase@2.120.0 stop --no-backup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-nightly-${{ github.run_id }}
          path: qa-knowledge/reports/
          retention-days: 30
