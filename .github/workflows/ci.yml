name: CI

# dev는 직접 push 금지(브랜치 보호 enforce_admins) → 진입은 PR로만.
# 따라서 CI는 PR에서만 돌린다. PR은 up-to-date(strict) 병합 프리뷰를 검증하므로
# 머지 후 재실행(on.push)은 중복이라 두지 않는다.
on:
  pull_request:
    branches:
      - main
      - dev

# 같은 ref에 새 커밋이 push되면 진행 중인 옛 CI run은 취소한다(자원 낭비 방지).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # 문서 경로 검사 결과를 PR 코멘트로 남긴다
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint 검사
        run: pnpm lint
      # FSD 레이어 경계는 결정론적 아키텍처 규칙이라 warn이 아닌 error로 강제 게이트.
      # (일반 lint는 only-warn이라 통과되므로 별도 config로 분리해 막는다.)
      - name: FSD 레이어 경계 검사
        run: pnpm --filter @smart-bookmark/web lint:fsd
      - name: 타입 검사
        run: pnpm typecheck
      # 문서(CLAUDE.md, PROJECT_INDEX.md, .claude/)에 적힌 경로가 실제로 있는지 검사한다.
      # 코드는 lint/typecheck가 지키지만 문서는 파일을 옮겨도 아무 검사에 안 걸려 계속 썩었다.
      # 결과는 PR 코멘트 하나로 유지하고(고치면 "해결됨"으로 갱신), 틀린 경로가 있으면 이 job을 실패시켜 머지를 막는다.
      - name: 문서 경로 검사
        id: docpaths
        continue-on-error: true
        run: node scripts/check-doc-paths.mjs --json doc-paths.json
      - name: 문서 경로 검사 결과 PR 코멘트
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true # 외부 fork PR처럼 코멘트 권한이 없을 때도 판정은 아래 단계가 한다
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("doc-paths.json")) return;
            const { problems } = JSON.parse(fs.readFileSync("doc-paths.json", "utf8"));
            const MARKER = "<!-- doc-paths-check -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(MARKER));

            if (problems.length === 0) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id,
                  body: `${MARKER}\n**문서 경로 검사**: 해결됨. 문서에 적힌 경로가 모두 저장소에 있습니다.`,
                });
              }
              return;
            }

            const rows = problems.map((p) => `| \`${p.file}:${p.line}\` | \`${p.path}\` |`).join("\n");
            const body = [
              MARKER,
              `**문서 경로 검사**: 문서에 적힌 경로 ${problems.length}개가 저장소에 없습니다. 이 PR은 고치기 전까지 머지할 수 없습니다.`,
              "",
              "| 문서:줄 | 없는 경로 |",
              "| --- | --- |",
              rows,
              "",
              "파일을 옮기거나 이름을 바꿨다면 경로 기준인 `PROJECT_INDEX.md`와 위 문서를 같이 고쳐 주세요.",
              "로컬 확인: `node scripts/check-doc-paths.mjs`",
            ].join("\n");
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: 문서 경로 검사 결과 판정
        if: ${{ steps.docpaths.outcome == 'failure' }}
        run: |
          echo "::error::문서에 적힌 경로가 저장소에 없습니다. PR 코멘트를 확인하세요."
          exit 1

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    # 일부 테스트가 모듈 로드 시 Supabase 클라이언트를 생성하므로 placeholder env 필요.
    # (실제 값 아님 — 테스트는 네트워크 호출 없이 mock으로 검증)
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 브라우저(Storybook) 프로젝트 제외한 unit/통합만 — CI에 Playwright 브라우저 미설치
      - name: 테스트 실행 + 커버리지
        run: pnpm --filter @smart-bookmark/web test:coverage
      - name: 커버리지 리포트 PR 코멘트
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: apps/web
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      GEMINI_API_KEY: placeholder-gemini-key
      RESEND_API_KEY: re_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright 브라우저 설치
        run: pnpm --filter @smart-bookmark/web exec playwright install --with-deps chromium
      - name: E2E 테스트 실행
        run: pnpm --filter @smart-bookmark/web test:e2e --project=chromium

  build:
    name: Build
    runs-on: ubuntu-latest
    # 빌드 시 참조되는 env — 실제 값이 아닌 placeholder (빌드는 네트워크 호출 없음).
    # 실제 시크릿은 Vercel 환경변수로 주입되며 CI 빌드엔 불필요.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      GEMINI_API_KEY: placeholder-gemini-key
      RESEND_API_KEY: re_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 빌드
        run: pnpm build
