name: Security Review Nudge

# 보안 리뷰 "알림"만 하는 워크플로우 — 리뷰를 강제하지도, 직접 돌리지도 않는다.
# 결정론 경계: "보안 민감 파일이 바뀌었나"는 경로 매칭이라 객관적 → 자동 감지.
#             "실제로 취약한가"는 판단이 필요 → 사람이 security-reviewer 에이전트를 부른다.
# 언제 보안 리뷰를 돌려야 하는지를 사람 기억에 맡기면 까먹는다(3월·7월 두 번만 돌렸음).
# 그래서 감지만 자동화하고, 실행 여부는 PR 작성자가 정한다. CI를 막지 않는다.
#
# 패턴 목록은 아래 SENSITIVE 한 곳에서만 관리한다(on.paths와 이중 관리하지 않으려고
# 모든 PR에서 돌린다. checkout 없이 API 호출만 해서 수 초 안에 끝난다).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - dev

concurrency:
  group: security-nudge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nudge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 보안 민감 파일 변경 감지 → PR 코멘트
        uses: actions/github-script@v7
        with:
          script: |
            const SENSITIVE = [
              { re: /^apps\/web\/src\/app\/api\//, why: "API 라우트 (인증 누락, IDOR)" },
              { re: /^apps\/web\/src\/middleware\.ts$/, why: "인증 미들웨어 (우회 경로)" },
              { re: /^apps\/web\/src\/app\/auth\//, why: "OAuth 콜백, 익스텐션 토큰 페이지" },
              { re: /^apps\/web\/src\/shared\/api\/supabase\//, why: "Supabase 클라이언트, 세션 판정" },
              { re: /^apps\/web\/src\/entities\/[^/]+\/api\/.*supabase.*\.ts$/, why: "Supabase repository (user_id 필터, IDOR)" },
              { re: /^apps\/web\/src\/shared\/lib\/(validateSsrf|validateUrl|rateLimit|guest|guestCookie)\.ts$/, why: "입력 검증, SSRF, rate limit, 게스트 쿠키" },
              { re: /^apps\/web\/src\/server\//, why: "서버 서비스 (크롤러: 외부 URL fetch)" },
              { re: /^supabase\/migrations\//, why: "DB 스키마, RLS 정책" },
              { re: /^apps\/web\/next\.config\.ts$/, why: "보안 헤더, 이미지 도메인" },
            ];
            const isTest = (f) => /\.test\.tsx?$/.test(f);
            const MARKER = "<!-- security-review-nudge -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            const hits = files
              .map((f) => f.filename)
              .filter((f) => !isTest(f))
              .map((f) => ({ file: f, rule: SENSITIVE.find((s) => s.re.test(f)) }))
              .filter((h) => h.rule);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(MARKER));

            // 감지 0건: 새 코멘트는 달지 않는다. 이전 push에서 달린 코멘트만 갱신한다.
            if (hits.length === 0) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id,
                  body: `${MARKER}\n**보안 리뷰 알림**: 최신 커밋 기준으로 보안 민감 파일 변경이 없습니다.`,
                });
              }
              core.info("보안 민감 파일 변경 없음");
              return;
            }

            const rows = hits.map((h) => `| \`${h.file}\` | ${h.rule.why} |`).join("\n");
            const targets = hits.map((h) => h.file).join(" ");
            const body = [
              MARKER,
              "**보안 리뷰 알림**: 이 PR이 보안 민감 파일을 바꿨습니다. 리뷰를 강제하지 않습니다. 필요하다고 판단되면 돌려 주세요.",
              "",
              "| 파일 | 확인할 것 |",
              "| --- | --- |",
              rows,
              "",
              "로컬 Claude Code에서 (security-reviewer 에이전트):",
              "```",
              `보안 검토해줘 ${targets}`,
              "```",
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            core.info(`보안 민감 파일 ${hits.length}개 감지`);
